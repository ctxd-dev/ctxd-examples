<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title description">
<title id="title">Five CTXD deployment architectures</title>
<desc id="description">Each row places source documents, the CTXD store, and an agent inside machine boundaries. Everything together uses one workstation. A remote agent reads a store on the source workstation. A local agent and sources can instead share a workstation while using a central store. A remote worker can hold both the store and agent. Finally, sources, store, and agent can each run on a separate machine. Green arrows publish text; dashed arrows connect agents to context for search and reads. Boundaries indicate placement, not access isolation.</desc>
<rect width="1200" height="1100" fill="#ffffff"/>
<style>
text { font-family: Inter, Arial, sans-serif; fill: #111111; }
.brand { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 38px; font-weight: 700; }
.heading { font-size: 26px; font-weight: 700; }
.name { font-size: 22px; font-weight: 600; }
.host { font-size: 15px; fill: #586254; }
.role { font-size: 15px; font-weight: 600; }
.note { font-size: 15px; fill: #586254; }
.machine { fill: #fafbf9; stroke: #d6ddd0; stroke-width: 1.5; }
.publish { fill: none; stroke: #20c20e; stroke-width: 2.5; stroke-linejoin: round; }
.query { fill: none; stroke: #596453; stroke-width: 2; stroke-dasharray: 6 5; }
</style>
<defs>
<g id="source">
