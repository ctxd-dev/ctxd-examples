<polygon points="1016,96 1007,91 1007,101" fill="#596453"/>
<polygon points="798,96 807,91 807,101" fill="#596453"/>
</g>
<g transform="translate(0 513)">
<text x="36" y="66" class="name" text-anchor="start">Local agent,</text>
<text x="36" y="95" class="name" text-anchor="start">central context</text>
<text x="36" y="134" class="note" text-anchor="start">Shared knowledge across a team</text>
<rect x="352" y="12" width="510" height="150" rx="14" class="machine"/>
