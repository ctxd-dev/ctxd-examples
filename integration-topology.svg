 <path d="M-39 4 H-13 L-4 13 H37 L30 35 H-35 Z" fill="#e6ebe1" stroke="#66705f" stroke-width="2" stroke-linejoin="round"/>
</g>
<g id="store">
 <path d="M-34 -21 V24 C-34 42 34 42 34 24 V-21 Z" fill="#111111" stroke="#20c20e" stroke-width="2"/>
 <ellipse cy="-21" rx="34" ry="11" fill="#1a1a1a" stroke="#20c20e" stroke-width="2"/>
 <path d="M-34 -6 C-34 12 34 12 34 -6 M-34 10 C-34 28 34 28 34 10" fill="none" stroke="#20c20e" stroke-width="2"/>
</g>
<g id="agent">
 <rect x="-38" y="-28" width="76" height="56" rx="5" fill="white" stroke="#66705f" stroke-width="2"/>
 <rect x="-32" y="-22" width="64" height="43" rx="3" fill="#111111"/>
 <path d="M-45 28 H45 L38 36 H-38 Z" fill="#e6ebe1" stroke="#66705f" stroke-width="2"/>
 <rect x="-19" y="-10" width="38" height="23" rx="7" fill="#1a1a1a" stroke="#66705f"/>
 <path d="M0 -10 V-16" stroke="#66705f" stroke-width="2"/>
 <circle cy="-17" r="2.5" fill="#20c20e"/><circle cx="-9" cy="0" r="3" fill="#20c20e"/><circle cx="9" cy="0" r="3" fill="#20c20e"/>
 <path d="M-6 8 H6" stroke="#a6b39e" stroke-width="2"/>
</g>
</defs>
<text x="36" y="58" class="brand">ctxd</text><text x="128" y="58" class="brand" style="fill:#20c20e">_</text>
<text x="220" y="46" class="heading">Five deployment architectures</text>
<text x="220" y="73" class="note">The same agent. Different locations for sources and context.</text>
