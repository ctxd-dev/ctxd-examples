<text x="108" y="117" class="note">Publish text</text>
<path d="M280 112 H334" class="query"/><polygon points="334,112 325,107 325,117" fill="#596453"/><polygon points="280,112 289,107 289,117" fill="#596453"/>
<text x="350" y="117" class="note">Search / read</text>
<rect x="570" y="101" width="32" height="22" rx="5" class="machine"/><text x="615" y="117" class="note">Machine boundary · placement, not isolation</text>

